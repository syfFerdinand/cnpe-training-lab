# Cluster kind du lab CNPE (1 control-plane + 1 worker)
# __LAB_DIR__ est remplacé par 01-cluster.sh
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cnpe
nodes:
- role: control-plane
  extraMounts:
  # Le dossier des policies d'audit est monté dans le noeud : on édite sur l'hôte, on redémarre l'apiserver
  - hostPath: __LAB_DIR__/kind/audit
    containerPath: /etc/kubernetes/policies
- role: worker
