apiVersion: v1
kind: Namespace
metadata: {name: tracing}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: jaeger, namespace: tracing}
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.62.0
        env: [{name: COLLECTOR_OTLP_ENABLED, value: "true"}]
        ports:
        - {containerPort: 16686}
        - {containerPort: 4317}
        - {containerPort: 4318}
---
apiVersion: v1
kind: Service
metadata: {name: jaeger, namespace: tracing}
spec:
  selector: {app: jaeger}
  ports:
  - {name: ui, port: 16686, targetPort: 16686}
  - {name: otlp-grpc, port: 4317, targetPort: 4317}
  - {name: otlp-http, port: 4318, targetPort: 4318}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector-config, namespace: tracing}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch: {}
    exporters:
      otlp/jaeger:
        endpoint: jaeger-collector:4317
        tls:
          insecure: true
      debug: {}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, memory_limiter]
          exporters: [otlp/jaeger]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: tracing}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.111.0
        args: ["--config=/conf/config.yaml"]
        ports: [{containerPort: 4317}]
        volumeMounts: [{name: conf, mountPath: /conf}]
      volumes:
      - name: conf
        configMap: {name: otel-collector-config}
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector, namespace: tracing}
spec:
  selector: {app: otel-collector}
  ports: [{name: otlp-grpc, port: 4317, targetPort: 4137}]
