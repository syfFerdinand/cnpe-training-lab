# Générateur de traces : à (re)lancer après avoir réparé le collector
#   kubectl -n tracing delete job telemetrygen --ignore-not-found && kubectl apply -f telemetrygen-job.yaml
apiVersion: batch/v1
kind: Job
metadata: {name: telemetrygen, namespace: tracing}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: gen
        image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.111.0
        args: ["traces", "--otlp-endpoint", "otel-collector:4317", "--otlp-insecure", "--traces", "20", "--service", "checkout"]
