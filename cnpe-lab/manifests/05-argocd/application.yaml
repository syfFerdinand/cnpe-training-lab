apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/gitea_admin/gitops-repo.git
    targetRevision: main
    path: apps/webapp/overlay/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-prod
