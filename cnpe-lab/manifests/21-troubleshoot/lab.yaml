apiVersion: v1
kind: Namespace
metadata:
  name: chaos-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: chaos-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
      - name: api
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: chaos-ops
spec:
  selector:
    app: payment-api
  ports:
  - port: 80
    targetPort: 80
