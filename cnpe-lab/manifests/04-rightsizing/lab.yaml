apiVersion: v1
kind: Namespace
metadata: {name: team-perf}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: team-perf}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        resources:
          requests: {cpu: "2", memory: 2Gi}     # sur-dimensionné (usage réel ~20m / 40Mi)
          limits: {cpu: "4", memory: 4Gi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: web, namespace: team-perf}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: webapp}   # mauvais nom
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: memory
      target: {type: Utilization, averageUtilization: 80}
