apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.platform.example.org
spec:
  group: platform.example.org
  scope: Cluster
  names:
    kind: WebApp
    plural: webapp
    singular: webapp
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              image: {type: string}
              replicas: {type: string}
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              image: {type: string}
              replicas: {type: string}
