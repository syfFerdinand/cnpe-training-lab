apiVersion: v1
kind: Namespace
metadata:
  name: team-alpha
  labels: {tenant: alpha}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: compute-quota, namespace: team-alpha}
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "6"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: team-alpha}
spec:
  replicas: 4
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
      - name: api
        image: nginx:1.27-alpine
        # pas de resources -> refusé par le quota
